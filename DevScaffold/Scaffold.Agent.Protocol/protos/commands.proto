syntax = "proto3";

package scaffold.agent;

option csharp_namespace = "Scaffold.Agent.Protocol";

import "inference.proto";
import "models.proto";

// ─────────────────────────────────────────────
// COMMAND ENVELOPE
// This is always the message sent on the command pipe.
//
// Imports the message types from inference.proto and models.proto –
// this is the only file that sees both.
//
// The oneof guarantees that only one command can be set at a time –
// at the binary level, only the active field gets serialized.
//
// In C#: CommandEnvelope.CommandCase enum + the corresponding property.
// ─────────────────────────────────────────────

message CommandEnvelope {
    oneof command {
        InferRequest        infer         = 1;
        CancelInferRequest  cancel        = 2;
        ShutdownRequest     shutdown      = 3;
        LoadModelRequest    load_model    = 4;
        UnloadModelRequest  unload_model  = 5;
        ListModelsRequest   list_models   = 6;
    }
}
