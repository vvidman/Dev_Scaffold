syntax = "proto3";

package scaffold.agent;

option csharp_namespace = "Scaffold.Agent.Protocol";

import "google/protobuf/timestamp.proto";

// ─────────────────────────────────────────────
// ENUMS
// ─────────────────────────────────────────────

// Proto3 rule: every enum's first value must be 0.
// This is the default value when the field is not set.

enum InferenceStatus {
    INFERENCE_STATUS_UNSPECIFIED = 0;
    INFERENCE_STATUS_STARTED     = 1;
    INFERENCE_STATUS_COMPLETED   = 2;
    INFERENCE_STATUS_CANCELLED   = 3;
    INFERENCE_STATUS_FAILED      = 4;
}

enum ModelStatus {
    MODEL_STATUS_UNSPECIFIED = 0;
    MODEL_STATUS_LOADING     = 1;
    MODEL_STATUS_LOADED      = 2;
    MODEL_STATUS_UNLOADED    = 3;
    MODEL_STATUS_FAILED      = 4;
}

// ─────────────────────────────────────────────
// SERVICE HOST LIFECYCLE EVENTS
// ─────────────────────────────────────────────

// Sent by the ServiceHost once it has started and is ready to receive commands.
// The CLI waits for this during auto-start – this is the ready signal.
message ServiceReadyEvent {
    string version                       = 1;
    google.protobuf.Timestamp started_at = 2;
}

// Sent by the ServiceHost before it shuts down.
// Lets the CLI know the connection is about to break.
message ServiceShuttingDownEvent {
    bool forced                              = 1;
    google.protobuf.Timestamp occurred_at   = 2;
}

// ─────────────────────────────────────────────
// MODEL LIFECYCLE EVENTS
// ─────────────────────────────────────────────

// Model load/unload status change.
// For lazy loading too, this event tells the CLI that
// the model's loading has started.
message ModelStatusChangedEvent {
    // For lazy loading, the InferRequest's request_id;
    // for an explicit LoadModelRequest, that request's request_id.
    string request_id                       = 1;
    string model_alias                      = 2;
    ModelStatus status                      = 3;
    string message                          = 4;  // optional detail, error message on failure
    google.protobuf.Timestamp occurred_at   = 5;
}

// Response to ListModelsRequest.
// Only contains the currently loaded models.
message LoadedModelsListEvent {
    string request_id                       = 1;
    repeated string loaded_aliases          = 2;  // list of loaded model aliases
    google.protobuf.Timestamp occurred_at   = 3;
}

// ─────────────────────────────────────────────
// INFERENCE LIFECYCLE EVENTS
// ─────────────────────────────────────────────

// Inference started – the model received the request.
message InferenceStartedEvent {
    string request_id                       = 1;
    string step_id                          = 2;
    string model_alias                      = 3;
    google.protobuf.Timestamp started_at    = 4;
}

// Inference in progress – periodic signal to the CLI.
// Not token-by-token streaming – just an occasional status message.
message InferenceProgressEvent {
    string request_id                       = 1;
    string step_id                          = 2;
    uint32 elapsed_seconds                  = 3;
    string status_message                   = 4;  // e.g. "Generation in progress..."
    google.protobuf.Timestamp occurred_at   = 5;
}

// Inference completed successfully.
message InferenceCompletedEvent {
    string request_id                           = 1;
    string step_id                              = 2;
    string output_file_path                     = 3;  // path to the generated output file
    uint32 elapsed_seconds                      = 4;
    uint32 tokens_generated                     = 5;
    google.protobuf.Timestamp completed_at      = 6;
}

// Inference cancelled – as a result of CancelInferRequest.
message InferenceCancelledEvent {
    string request_id                       = 1;
    string step_id                          = 2;
    google.protobuf.Timestamp occurred_at   = 3;
}

// Inference error – the AI could not execute the request.
message InferenceFailedEvent {
    string request_id                       = 1;
    string step_id                          = 2;
    string error_message                    = 3;
    google.protobuf.Timestamp occurred_at   = 4;
}

// ─────────────────────────────────────────────
// GENERAL ERROR EVENT
// An error that cannot be tied to a specific request.
// E.g. corrupt model file, Named Pipe error, etc.
// ─────────────────────────────────────────────

message ServiceErrorEvent {
    string error_code                       = 1;  // for machine processing
    string error_message                    = 2;  // human readable
    google.protobuf.Timestamp occurred_at   = 3;
}

// ─────────────────────────────────────────────
// EVENT ENVELOPE
// This is always the message sent on the event pipe.
// Same principle as CommandEnvelope –
// the oneof guarantees only one event can be set at a time.
// ─────────────────────────────────────────────

message EventEnvelope {
    oneof event {
        ServiceReadyEvent        service_ready         = 1;
        ServiceShuttingDownEvent service_shutting_down = 2;
        ModelStatusChangedEvent  model_status_changed  = 3;
        LoadedModelsListEvent    loaded_models_list    = 4;
        InferenceStartedEvent    inference_started     = 5;
        InferenceProgressEvent   inference_progress    = 6;
        InferenceCompletedEvent  inference_completed   = 7;
        InferenceCancelledEvent  inference_cancelled   = 8;
        InferenceFailedEvent     inference_failed      = 9;
        ServiceErrorEvent        service_error         = 10;
    }
}
