syntax = "proto3";

package scaffold.agent;

option csharp_namespace = "Scaffold.Agent.Protocol";

// ─────────────────────────────────────────────
// INFERENCE REQUEST
// Sent by the CLI on the command pipe.
// ─────────────────────────────────────────────

message InferRequest {
    // Correlation identifier – ties the request to the events
    // arriving on the event pipe. Generated by the CLI, GUID format recommended.
    string request_id = 1;

    // The pipeline step's identifier – e.g. "task_breakdown"
    // Used by the ServiceHost for logging and status display.
    string step_id = 2;

    // The model alias – the name defined in models.yaml.
    // e.g. "qwen-coder-7b"
    // The ServiceHost resolves the actual GGUF path from this.
    string model_alias = 3;

    // The agent's system prompt – comes from the step agent config yaml.
    // Tells the AI what role to take on.
    string system_prompt = 4;

    // The assembled user input – the output of InputAssembler.
    // Contains the input yaml and the content of every path reference.
    string user_input = 5;

    // Maximum number of tokens in the response.
    // If 0, the ServiceHost uses its default value.
    uint32 max_tokens = 6;

    // Provided by the CLI, the ServiceHost writes into this
    string output_folder = 7;
}

// ─────────────────────────────────────────────
// INFERENCE CANCELLATION
// Sent by the CLI when the human cancels the run (Ctrl+C).
// ─────────────────────────────────────────────

message CancelInferRequest {
    // Which request to cancel.
    string request_id = 1;
}

// ─────────────────────────────────────────────
// SHUTDOWN REQUEST
// Sent by the CLI when it wants to stop the ServiceHost.
// ─────────────────────────────────────────────

message ShutdownRequest {
    // If true, cancels the active inference immediately too.
    // If false, waits for the active inference to finish, then shuts down.
    bool force = 1;
}
