syntax = "proto3";

package scaffold.agent;

option csharp_namespace = "Scaffold.Agent.Protocol";

// ─────────────────────────────────────────────
// MODEL PRELOAD
// Optional – not required to call with lazy loading.
// Useful if you know in advance that you'll need the model
// and don't want the first inference request to wait.
// ─────────────────────────────────────────────

message LoadModelRequest {
    // Correlation identifier – the loading events on the event pipe
    // arrive with this same id.
    string request_id = 1;

    // The alias of the model to load – as defined in models.yaml.
    string model_alias = 2;
}

// ─────────────────────────────────────────────
// MODEL UNLOAD
// Frees the model from memory.
// Cannot be executed during an active inference –
// the ServiceHost waits for it to finish.
// ─────────────────────────────────────────────

message UnloadModelRequest {
    string request_id = 1;
    string model_alias = 2;
}

// ─────────────────────────────────────────────
// QUERY LOADED MODELS
// Only returns the models currently in memory.
// Lets the human know exactly which models are available –
// only the loaded state matters here.
// ─────────────────────────────────────────────

message ListModelsRequest {
    string request_id = 1;
}
